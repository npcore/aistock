[project]
name = "aistock"
version = "0.1.0"
description = "키움 REST API 기반 자동주식거래 시스템"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
aistock = "aistock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aistock"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
